name: AWS durable reviewer eval

on:
  workflow_dispatch:
    inputs:
      fixture-source-sha:
        description: Exact svozza/aceiro commit containing the canonical fixtures
        required: true
        type: string
      fixture:
        description: Exported fixture name
        required: true
        type: string
      model:
        description: Bedrock model ID
        required: true
        default: global.anthropic.claude-sonnet-5
        type: string
      reasoning-effort:
        description: Claude reasoning effort
        required: true
        default: xhigh
        type: choice
        options: [low, medium, high, xhigh, max]
      aws-region:
        description: Region where AWS_BEARER_TOKEN_BEDROCK was created
        required: true
        default: eu-west-1
        type: string
      comparison-fixture:
        description: Comparison-arm fixture name recorded in the artifact
        required: false
        default: ""
        type: string
      run-index:
        description: Repetition index
        required: false
        default: 1
        type: number
  workflow_call:
    inputs:
      fixture-source-sha:
        required: true
        type: string
      fixture:
        required: true
        type: string
      model:
        required: true
        type: string
      reasoning-effort:
        required: true
        type: string
      aws-region:
        required: true
        type: string
      comparison-fixture:
        required: true
        type: string
      run-index:
        required: true
        type: number
    secrets:
      AWS_BEARER_TOKEN_BEDROCK:
        required: true

permissions: {}

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ai-pr-review-runtime
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: svozza/aceiro
          ref: ${{ inputs['fixture-source-sha'] }}
          path: fixture-source
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
      - name: Verify snapshot and adapt fixture
        env:
          FIXTURE: ${{ inputs.fixture }}
          FIXTURE_SOURCE_SHA: ${{ inputs['fixture-source-sha'] }}
          COMPARISON_FIXTURE: ${{ inputs['comparison-fixture'] }}
          RUN_INDEX: ${{ inputs['run-index'] }}
        run: |
          uv run --project harness --frozen python harness/eval/run_aws_durable_eval.py \
            --fixture-source fixture-source \
            --fixture-source-sha "$FIXTURE_SOURCE_SHA" \
            --fixture "$FIXTURE" \
            --output-dir "$RUNNER_TEMP/eval-record"
          jq \
            --arg comparison_fixture "${COMPARISON_FIXTURE:-$FIXTURE}" \
            --argjson run_index "$RUN_INDEX" \
            '. + {comparison_fixture: $comparison_fixture, run_index: $run_index}' \
            "$RUNNER_TEMP/eval-record/run-record.json" \
            > "$RUNNER_TEMP/eval-record/run-record.tmp"
          mv "$RUNNER_TEMP/eval-record/run-record.tmp" "$RUNNER_TEMP/eval-record/run-record.json"
          cp -R "$RUNNER_TEMP/eval-record/workspace/." .
          mkdir .ai-review-toolkit
          cp -R harness/upstream/aws-durable-execution-ci/.github harness/upstream/aws-durable-execution-ci/scripts .ai-review-toolkit/
          git init
          git config user.name "AWS durable eval"
          git config user.email "aws-durable-eval@example.invalid"
          git add README.md CONTRIBUTING.md
          git commit -m "fixture trusted base"
          chmod -R a-w fixture-source
      - name: Prepare unprivileged Claude user
        run: |
          bash .ai-review-toolkit/scripts/prepare_ai_review_user.sh claude-review
          sudo chmod -R o-rwx,g-rwx harness fixture-source
          sudo sh -c 'printf "%s\n" \
            "Defaults:runner env_keep += \"AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_REGION AWS_DEFAULT_REGION AWS_BEARER_TOKEN_BEDROCK\"" \
            "Defaults:runner env_keep += \"ANTHROPIC_BEDROCK_BASE_URL CLAUDE_CODE_USE_BEDROCK CLAUDE_CODE_ENTRYPOINT CLAUDE_CODE_ACTION CLAUDE_CODE_ATTRIBUTION_HEADER\"" \
            "Defaults:runner env_keep += \"CLAUDE_CODE_SUBPROCESS_ENV_SCRUB CLAUDE_CODE_SCRIPT_CAPS DETAILED_PERMISSION_MESSAGES\"" \
            > /etc/sudoers.d/claude-review-env'
          sudo chmod 440 /etc/sudoers.d/claude-review-env
          sudo visudo -cf /etc/sudoers.d/claude-review-env
      - name: Resolve prompt
        id: prompt
        run: |
          path="$(bash "$GITHUB_WORKSPACE/.ai-review-toolkit/scripts/resolve_ai_review_prompt.sh" "")"
          {
            echo 'text<<AWS_DURABLE_PROMPT'
            cat "$path"
            echo 'AWS_DURABLE_PROMPT'
            echo "schema=$(jq -c . .ai-review-toolkit/.github/prompts/ai-pr-review-schema.json)"
          } >> "$GITHUB_OUTPUT"
      - name: Review with pinned native action
        id: review
        continue-on-error: true
        uses: anthropics/claude-code-action@fa7e2f0a29a126f0b81cdcf360561b36e44cf608
        env:
          AWS_REGION: ${{ inputs['aws-region'] }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          CLAUDE_CODE_USE_BEDROCK: "1"
          CLAUDE_CODE_ATTRIBUTION_HEADER: "0"
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_bedrock: "true"
          path_to_claude_code_executable: ${{ github.workspace }}/.ai-review-toolkit/scripts/run_claude_isolated.sh
          allowed_non_write_users: ${{ github.actor }}
          classify_inline_comments: "false"
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --model ${{ inputs.model }}
            --effort ${{ inputs['reasoning-effort'] }}
            --max-turns 20
            --bare
            --tools "Read,Grep,Glob"
            --allowedTools "Read,Grep,Glob"
            --disallowedTools "Bash,Write,Edit,NotebookEdit,WebFetch,WebSearch"
            --json-schema '${{ steps.prompt.outputs.schema }}'
      - name: Preserve action execution
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          mkdir -p "$RUNNER_TEMP/action-output"
          if [[ -n "$EXECUTION_FILE" && -r "$EXECUTION_FILE" ]]; then
            cp "$EXECUTION_FILE" "$RUNNER_TEMP/action-output/claude-execution.json"
          fi
      - name: Extract and grade
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          FIXTURE: ${{ inputs.fixture }}
          FIXTURE_SOURCE_SHA: ${{ inputs['fixture-source-sha'] }}
        run: |
          uv run --project harness --frozen python harness/eval/run_aws_durable_eval.py \
            --fixture-source fixture-source \
            --fixture-source-sha "$FIXTURE_SOURCE_SHA" \
            --fixture "$FIXTURE" \
            --output-dir "$RUNNER_TEMP/result" \
            --execution-file "$EXECUTION_FILE"
          if [[ -f "$RUNNER_TEMP/result/review.json" ]]; then
            uv run --project harness --frozen python harness/eval/grade_aws_durable_eval.py \
              --review "$RUNNER_TEMP/result/review.json" \
              --fixture-source fixture-source \
              --fixture "$FIXTURE" \
              --output "$RUNNER_TEMP/result/grade.json"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: aws-durable-eval-${{ github.run_id }}-${{ inputs['comparison-fixture'] || inputs.fixture }}-${{ inputs['run-index'] }}
          path: |
            ${{ runner.temp }}/eval-record/run-record.json
            ${{ runner.temp }}/action-output
            ${{ runner.temp }}/result
          if-no-files-found: error
          retention-days: 30
